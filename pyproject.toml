[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bia-science"
version = "0.1.0"
description = "Núcleo científico local da bIA — sem APIs de modelos comerciais"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "sqlalchemy>=2.0,<3",
    "pydantic>=2,<3", "pypdf>=4,<7", "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.2,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "torch>=2.2,<3", "reportlab>=4,<5"]
postgres = ["psycopg[binary]>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["bia_core*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
