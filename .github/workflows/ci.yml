name: bIA core CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Compile Python
        run: python -m compileall -q bia_core apps tests
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bia
          POSTGRES_PASSWORD: bia-ci-only
          POSTGRES_DB: bia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bia -d bia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BIA_TEST_POSTGRES_URL: postgresql+psycopg://bia:bia-ci-only@localhost:5432/bia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project with PostgreSQL driver
        run: python -m pip install -e '.[test,postgres]'
      - name: Test PostgreSQL transactions across OS processes
        run: python -m pytest -q tests/test_postgres_integration.py
